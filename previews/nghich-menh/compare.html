<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>So sánh hai thiết kế · Cổ Chân Nhân</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9e3d3;color:#18352b;font:13px/1.5 system-ui,sans-serif}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;border-bottom:1px solid #c5c5ad}h1{font-size:16px;margin:0}small{color:#556655}button,a{font:inherit;color:inherit}button{padding:8px 14px;border:1px solid #6c8066;background:transparent;cursor:pointer;min-height:40px}button[aria-pressed=true]{background:#1b392e;color:#eee3cb}main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}section{min-width:0}h2{font-size:12px;font-weight:500;margin:0 0 10px;display:flex;justify-content:space-between;gap:12px}iframe{width:100%;height:calc(100svh - 135px);min-height:550px;border:1px solid #8c9a82;background:#122b24}body.mobile iframe{max-width:390px;margin:auto;display:block}body.mobile section{background:#ded7c4}body.mobile h2{padding:8px 12px}a{text-underline-offset:3px}@media(max-width:800px){main{grid-template-columns:1fr}header{align-items:start;flex-wrap:wrap}iframe{height:800px}h2{margin-top:8px}}
  </style>
</head>
<body>
  <header><div><h1>Hai góc nhìn. Cùng một thế giới.</h1><small>Hai prototype độc lập · Có thể thao tác trực tiếp trong từng khung</small></div><div><button data-mode="wide" aria-pressed="true">Tự co theo khung</button> <button data-mode="mobile" aria-pressed="false">Mobile · 390px</button></div></header>
  <main>
    <section><h2><span>A · Preview hiện có của bạn</span><a href="../../ui_v2_preview.html" target="_blank" rel="noopener">Mở toàn màn ↗</a></h2><iframe src="../../ui_v2_preview.html" title="Bản A — preview hiện có"></iframe></section>
    <section><h2><span>B · Nghịch Mệnh — thiết kế độc lập</span><a href="index.html" target="_blank" rel="noopener">Mở toàn màn ↗</a></h2><iframe src="index.html" title="Bản B — Nghịch Mệnh"></iframe></section>
  </main>
  <script>document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.body.classList.toggle('mobile',button.dataset.mode==='mobile');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));</script>
</body>
</html>
